# Continuous integration (brief §25, docs/ci.md). Runs on every push and pull request.
#
# Jobs:
#   lint         ruff (lint + format) and mypy
#   unit         unit tests, every LLM call mocked
#   integration  integration tests against a PostgreSQL 16 service container after the seed;
#                they may never be skipped (REQUIRE_DATABASE=1 turns a missing database into
#                a failure), so the safety and access-control tests always run
#   ui           eslint, TypeScript, Vitest and the Next.js build
#   live-eval    ~15 evaluation cases with the real model (every unsafe and access-control
#                case); fails on any executed unsafe query, any leak, or low accuracy.
#                It costs model credits, so it runs only on pushes to main, once a week and
#                on demand (Actions -> CI -> Run workflow), never on every branch push.
#                Needs the LLM_API_KEY repository secret; without it (for example on forks)
#                only this job is skipped, with a notice.
#
# The database values below are throwaway credentials for the temporary service container
# of each run, not real secrets. Real keys come only from GitHub Actions secrets.
name: CI

on:
  push:
  pull_request:
  # Weekly live evaluation to notice model drift (Mondays 06:00 UTC).
  schedule:
    - cron: "0 6 * * 1"
  # Manual run from the Actions tab (also runs the live evaluation).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  PYTHONUNBUFFERED: "1"
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_DB: northwind
  POSTGRES_USER: northwind_owner
  POSTGRES_PASSWORD: ci-owner-throwaway
  APP_DATABASE_URL: postgresql+asyncpg://app_rw:ci-app-throwaway@localhost:5432/northwind
  ANALYTICS_DATABASE_URL: postgresql+asyncpg://analytics_ro:ci-ro-throwaway@localhost:5432/northwind
  JWT_SECRET_KEY: ci-only-jwt-signing-key-not-used-anywhere-else
  LANGSMITH_TRACING: "false"
  DEMO_PASSWORD_SALES_EUROPE: ci-demo-password-1
  DEMO_PASSWORD_SALES_AMERICAS: ci-demo-password-2
  DEMO_PASSWORD_SALES_OTHER: ci-demo-password-3
  DEMO_PASSWORD_FINANCE: ci-demo-password-4
  DEMO_PASSWORD_OPERATIONS: ci-demo-password-5
  DEMO_PASSWORD_ADMIN: ci-demo-password-6
  DEMO_PASSWORD_NO_ROLE: ci-demo-password-7
  DEMO_PASSWORD_DISABLED_USER: ci-demo-password-8

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            docker/constraints.txt
      - run: pip install -c docker/constraints.txt -e ".[dev]"
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: mypy
        run: mypy

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            docker/constraints.txt
      - run: pip install -c docker/constraints.txt -e ".[dev]"
      - name: Unit tests (LLM mocked)
        run: pytest tests/unit -q --cov --cov-report=term

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: northwind_owner
          POSTGRES_PASSWORD: ci-owner-throwaway
          POSTGRES_DB: northwind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U northwind_owner -d northwind"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/database
      - name: Semantic layer matches the database (schema drift)
        run: python -m scripts.schema_check
      - name: Evaluation cases still match the data
        run: python -m eval.check_cases
      - name: Integration tests (real database, scripted LLM)
        run: pytest tests/integration -q --cov --cov-report=term

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  live-eval:
    runs-on: ubuntu-latest
    needs: [lint, unit]
    # Real model calls cost credits: only on main, the weekly schedule or a manual run.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: northwind_owner
          POSTGRES_PASSWORD: ci-owner-throwaway
          POSTGRES_DB: northwind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U northwind_owner -d northwind"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - name: Is the LLM secret available?
        id: secret
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::notice title=Live evaluation skipped::LLM_API_KEY is not set (for example on a fork). Only this job is skipped; the safety tests in 'unit' and 'integration' still ran."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secret.outputs.available == 'true'
      - uses: ./.github/actions/database
        if: steps.secret.outputs.available == 'true'
      - name: Live evaluation gate (unsafe executed, leaks, accuracy)
        if: steps.secret.outputs.available == 'true'
        run: python -m eval.ci_gate
