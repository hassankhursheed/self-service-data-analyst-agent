name: Prepare the database
description: >
  Install the Python project, load the public Northwind dump into the PostgreSQL service
  container and run the idempotent seed (migrations, date shift, roles, users, views,
  semantic layer, verified examples). Expects the CI environment variables of ci.yml.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          docker/constraints.txt
    - name: Install the project
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -c docker/constraints.txt -e ".[dev]"
    - name: Load Northwind into the service container
      shell: bash
      run: |
        until pg_isready -h localhost -p 5432 -U "$POSTGRES_USER"; do sleep 1; done
        PGPASSWORD="$POSTGRES_PASSWORD" psql -h localhost -p 5432 -U "$POSTGRES_USER" \
          -d "$POSTGRES_DB" -q -v ON_ERROR_STOP=1 -f data/northwind/northwind.sql
    - name: Seed (migrations, access rules, test users, semantic layer)
      shell: bash
      run: python -m scripts.seed
