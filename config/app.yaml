# Non-secret application settings, versioned in git.
# Secrets and connection strings never go here: they come from environment
# variables (see .env.example). An environment variable overrides a value here,
# for example APP__LOG_LEVEL=DEBUG overrides app.log_level.
config_version: 1

app:
  name: AskData - Self-Service Data Analyst Agent
  log_level: INFO

# Connection pool for the application role (app/db/session.py).
database:
  pool_size: 5
  max_overflow: 10
  pool_timeout_seconds: 30
  pool_recycle_seconds: 1800
  connect_timeout_seconds: 10

# Seed script (scripts/seed.py). See docs/data-setup.md.
data_setup:
  # Years added to every Northwind date column, applied exactly once.
  date_shift_years: 27
  wait_for_db_seconds: 60

# Agent queries through the read-only analytics_ro login (app/db/analytics.py).
analytics:
  # Backstop timeout set on the analytics_ro role itself.
  role_statement_timeout_ms: 30000
  default_statement_timeout_ms: 10000
  default_row_limit: 1000
  # Recommended extra (brief §12): before running a query, ask PostgreSQL for its plan
  # (EXPLAIN, nothing is executed) and refuse it when the estimated total cost is above
  # this. Verified examples cost under 700; a cross join of orders and order_details
  # costs 13,000-27,000. 0 turns the check off.
  max_plan_cost: 10000

# Login and access tokens (app/auth, docs/authentication.md). The signing key is
# JWT_SECRET_KEY in the environment.
auth:
  jwt_algorithm: HS256
  access_token_minutes: 60
  issuer: northwind-data-analyst
  min_password_length: 10

# HTTP API (app/api, docs/api.md).
api:
  version: "0.1.0"
  # Browser origins allowed by CORS (the Next.js UI).
  cors_origins: ["http://localhost:3000"]
  # Public demo protection (Step 25): new questions stop for the rest of the UTC day once
  # today's estimated LLM cost reaches this amount. 0 turns it off.
  daily_cost_cap_usd: 2.0
  # Use the client address the UI server forwards (X-Forwarded-For) for login limits and
  # the audit log. Only turn on where the API has no public address (Railway:
  # API__TRUST_FORWARDED_FOR=true); otherwise anyone could send a made-up address.
  trust_forwarded_for: false
  rate_limits:
    questions_per_minute: 20
    logins_per_minute_per_ip: 10
  default_page_size: 20
  # Rows of a result returned per page to the UI (the table is paginated).
  result_page_size: 50
  # Refuse to start when the semantic layer names a table or column the database no
  # longer has (Step 24), so a renamed column is found before users see errors.
  schema_check_on_startup: true
  max_page_size: 100

# Admin Monitoring page (app/services/metrics.py, docs/monitoring.md). Operational
# metrics use real time, not the business reference date of the data.
monitoring:
  time_zone: UTC
  max_period_days: 92

# Log retention (recommended extra, brief §27, docs/security.md): python -m scripts.clean_logs
# removes audit log entries, node steps, blocked-query records, alerts and resolved errors
# older than this many days. Conversations, questions and runs are kept.
retention:
  log_days: 90

# Alerts (recommended extra, brief §26, docs/monitoring.md): checked by the API every
# check_every_seconds over the last window_minutes; each alert is stored in app.alerts and,
# when ALERT_SLACK_WEBHOOK_URL is set, sent to Slack. One alert per type per cooldown.
alerts:
  enabled: true
  check_every_seconds: 300
  window_minutes: 60
  cooldown_minutes: 60
  min_questions_for_failure_rate: 5
  thresholds:
    failure_rate: 0.3        # share of finished questions that FAILED in the window
    blocked_attempts: 10     # blocked queries in the window
    failed_logins: 10        # failed logins in the window
    daily_cost_usd: 1.5      # estimated LLM cost today (UTC); the hard cap is api.daily_cost_cap_usd
