# Agent graph settings. Bump graph_version when nodes, routing or transitions change;
# it is recorded with every run (brief section 23).
graph_version: "0.5.0"

# N-03 / N-04 (brief section 14, docs/intent-and-clarification.md).
intent:
  # Missing parts that would change the answer: always ask.
  blocking_parts: [metric, entity, grouping]
  # Missing parts with a stated default instead of a question (unless we are asking anyway).
  default_period: this year
  default_top_n: 10
  # One clarification round, a second only if the reply is still unclear.
  max_clarification_rounds: 2
  # Regenerations after malformed structured output.
  max_regenerations: 1
  # Used when the model does not offer metric options.
  fallback_metric_options: [revenue, number_of_orders]

# N-06 to N-09 (brief sections 12, 13, 15; docs/sql-generation.md).
sql:
  # Regenerations after malformed structured output (N-06 and N-09).
  max_regenerations: 1
  # Repairs after a database error; one more failure ends the question as FAILED.
  max_repair_attempts: 2
  # Database error text sent back to the model is cut to this length.
  repair_error_max_chars: 500
  # Attempts when the database cannot be reached (connection errors only).
  db_connect_attempts: 3
  db_connect_backoff_seconds: 0.5

# N-10 (brief section 17, docs/answers-and-charts.md).
answer:
  # Rows the LLM sees when writing the explanation.
  rows_for_llm: 20
  # Rows per page in the response table.
  page_size: 50
  # Regenerations when the explanation states a number not in the result; then a template.
  max_regenerations: 1
  low_confidence_label: >-
    Low confidence: please check the SQL, the period and the assumptions before relying on
    this answer.
  empty_suggestion: >-
    Try a broader question, for example a longer period or fewer filters.
  chart:
    max_bars: 30
    max_line_points: 400
    max_series: 3

# N-05 / N-06: verified query library (brief section 16, docs/verified-queries.md).
verified_examples:
  # Turned off for "without verified examples" evaluation runs.
  enabled: true
  # Few-shot examples passed to SQL generation at most.
  max_examples: 3
  # Keyword similarity (0-1) an example needs to be offered.
  min_score: 0.4

