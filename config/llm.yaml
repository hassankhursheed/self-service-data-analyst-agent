# LLM settings (brief sections 22 and 27). The API key comes from LLM_API_KEY; tracing
# from the LANGSMITH_* environment variables. Bump `version` when anything here changes;
# evaluation runs record it.
version: 4

# LangChain provider name (init_chat_model) and model: a dated version, so the app and
# the evaluation (config/eval.yaml) use exactly the same model. Ministral 14B is the
# strongest model the project's Mistral free credits allow (Mistral Small and Medium
# are refused with 429 on that plan).
provider: mistralai
model: ministral-14b-2512
temperature: 0.0
max_tokens: 1024

# Per-attempt timeout for one LLM call.
timeout_seconds: 30

# Retries for retryable errors only (timeouts, rate limits, 5xx, connection errors).
# Waits 3 s, 7.5 s and 18.75 s (about 30 s in all): the free Mistral plan limits requests
# per minute, and the Step 26 walk-through showed 1 s + 2 s was too short to get past it.
retry:
  max_attempts: 4
  initial_backoff_seconds: 3.0
  backoff_multiplier: 2.5
  max_backoff_seconds: 20.0

# Per-question budget across all LLM calls of one question.
budget:
  max_tokens_per_question: 20000
  max_cost_usd_per_question: 0.05

# Estimated prices (USD per million tokens) for cost tracking, Ministral 14B list price
# at the time of writing; check the provider's current price list before relying on them.
# Calls on free credits are not billed, but the estimate still shows the real cost.
pricing:
  input_per_million_usd: 0.20
  output_per_million_usd: 0.20

# Prompt name -> version used by the agent (files in config/prompts/<name>/<version>.yaml).
prompts:
  system: v1
  intent: v3
  sql_generation: v3
  sql_repair: v1
  answer: v1
