name: data-analyst-agent

# One command starts everything (docs/deployment.md):
#   docker compose up -d --build
# 1. db       PostgreSQL 16; the public Northwind dump is loaded on first start
# 2. migrate  runs the idempotent seed (migrations, date shift, roles, users, views,
#             semantic layer, verified examples) and exits
# 3. api      FastAPI service (waits for migrate to finish successfully)
# 4. ui       Next.js server (waits for the API to be healthy)
#
# Only the database (for tests and local development with the API on the host):
#   docker compose up -d db

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-northwind}
    ports:
      # Host port defaults to 5433 so it does not clash with a local PostgreSQL on 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Loaded once, on first start with an empty volume, into the public schema.
      - ./data/northwind/northwind.sql:/docker-entrypoint-initdb.d/01-northwind.sql:ro
    healthcheck:
      # TCP check: during first-start loading PostgreSQL only listens on a local socket,
      # so this stays unhealthy until the Northwind data is fully loaded.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  migrate:
    image: data-analyst-agent-api:latest
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOSTPORT: db:5432
    command: ["python", "-m", "scripts.seed"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    image: data-analyst-agent-api:latest
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOSTPORT: db:5432
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ui:
    image: data-analyst-agent-ui:latest
    build:
      context: ./ui
    restart: unless-stopped
    environment:
      # Server-side only: the browser talks to the UI, the UI talks to the API.
      API_BASE_URL: http://api:8000
      # Plain HTTP on localhost; behind HTTPS in production leave this unset.
      UI_INSECURE_COOKIES: ${UI_INSECURE_COOKIES:-1}
    ports:
      - "${UI_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
