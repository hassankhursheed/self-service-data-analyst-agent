[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "self-service-data-analyst-agent"
version = "0.1.0"
description = "Governed self-service data analyst agent for the Northwind Traders sample database."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # API service
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    # Database
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    # Settings and data models
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0.2",
    # Agent and tracing
    "langchain>=1.0,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=2.0",
    "langsmith>=0.3",
    "langchain-mistralai>=1.0",  # default LLM provider (config/llm.yaml)
    # SQL parsing and validation
    "sqlglot>=26",
    # Authentication
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    # Chart specs returned by the API (rendered by the Next.js UI)
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "ANN", "S", "PT", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# pytest uses assert; tests use obviously fake credentials.
"tests/**/*.py" = ["S101", "S105", "S106"]
# Alembic writes long generated lines; the files are reviewed, not hand-formatted.
"migrations/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs a running PostgreSQL database"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "scripts", "migrations/env.py"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
# asyncpg ships no type information.
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
