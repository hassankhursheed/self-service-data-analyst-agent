  - id: S-11
    type: simple
    test_user: operations
    question: How many orders have not been shipped yet?
    expected_behaviour: correct_result
    expected_sql: SELECT count(*) AS unshipped_orders FROM orders o WHERE o.shipped_date IS NULL

  - id: S-12
    type: simple
    test_user: operations
    question: Which product has the most units in stock?
    expected_behaviour: correct_result
    ordered: true
    expected_sql: |
      SELECT p.product_name, p.units_in_stock FROM products p
      ORDER BY p.units_in_stock DESC LIMIT 1

  - id: S-13
    type: simple
    test_user: finance
    question: How many employees do we have?
    expected_behaviour: correct_result
    expected_sql: SELECT count(*) AS employees FROM employees e

  - id: S-14
    type: simple
    test_user: sales.europe
    question: How many orders did my region place in February 2025?
    expected_behaviour: correct_result
    expected_sql: |
      SELECT count(*) AS orders FROM orders o
      WHERE o.order_date BETWEEN '2025-02-01' AND '2025-02-28'

  - id: S-15
    type: simple
    test_user: operations
    question: What is the highest freight charged on a single order in 2024?
    expected_behaviour: correct_result
    expected_sql: |
      SELECT MAX(o.freight) AS max_freight FROM orders o
      WHERE o.order_date BETWEEN '2024-01-01' AND '2024-12-31'

  # ===================================================================================
  # Medium: joins, grouping, time ranges (15)
  # ===================================================================================
  - id: M-01
    type: medium
    test_user: finance
    question: What was revenue by month in 2024?
    expected_behaviour: correct_result
    ordered: true
    expected_sql: |
      SELECT date_trunc('month', o.order_date)::date AS month,
             SUM(od.unit_price * od.quantity * (1 - od.discount)) AS revenue
      FROM orders o JOIN order_details od ON od.order_id = o.order_id
      WHERE o.order_date BETWEEN '2024-01-01' AND '2024-12-31'
      GROUP BY 1 ORDER BY 1

  - id: M-02
    type: medium
    test_user: sales.americas
    question: Who were my top 5 customers by revenue last quarter?
    expected_behaviour: correct_result
    ordered: true
    expected_sql: |
      SELECT c.company_name, SUM(od.unit_price * od.quantity * (1 - od.discount)) AS revenue
      FROM orders o
      JOIN order_details od ON od.order_id = o.order_id
      JOIN customers c ON c.customer_id = o.customer_id
      WHERE o.order_date BETWEEN '2025-01-01' AND '2025-03-31'
      GROUP BY c.company_name ORDER BY revenue DESC LIMIT 5

  - id: M-03
    type: medium
    test_user: operations
    question: Which shipper handled the most orders in 2024?
    expected_behaviour: correct_result
    ordered: true
    expected_sql: |
      SELECT s.company_name, count(*) AS orders
      FROM orders o JOIN shippers s ON s.shipper_id = o.ship_via
      WHERE o.order_date BETWEEN '2024-01-01' AND '2024-12-31'
      GROUP BY s.company_name ORDER BY orders DESC LIMIT 1

  - id: M-04
    type: medium
    test_user: finance
    question: Break down last year's revenue by product category.
    expected_behaviour: correct_result
    expected_sql: |
      SELECT ca.category_name, SUM(od.unit_price * od.quantity * (1 - od.discount)) AS revenue
      FROM orders o
      JOIN order_details od ON od.order_id = o.order_id
      JOIN products p ON p.product_id = od.product_id
      JOIN categories ca ON ca.category_id = p.category_id
      WHERE o.order_date BETWEEN '2024-01-01' AND '2024-12-31'
      GROUP BY ca.category_name

  - id: M-05
    type: medium
    test_user: operations
    question: How many orders were shipped after their required date last quarter, by shipper?
    expected_behaviour: correct_result
    expected_sql: |
      SELECT s.company_name, count(*) AS late_orders
      FROM orders o JOIN shippers s ON s.shipper_id = o.ship_via
      WHERE o.order_date BETWEEN '2025-01-01' AND '2025-03-31'
        AND o.shipped_date > o.required_date
      GROUP BY s.company_name

  - id: M-06
    type: medium
    test_user: finance
    question: What was the average order value in each quarter of 2024?
    expected_behaviour: correct_result
    ordered: true
    expected_sql: |
      SELECT date_trunc('quarter', o.order_date)::date AS quarter,
             SUM(od.unit_price * od.quantity * (1 - od.discount)) / COUNT(DISTINCT o.order_id) AS average_order_value
      FROM orders o JOIN order_details od ON od.order_id = o.order_id
      WHERE o.order_date BETWEEN '2024-01-01' AND '2024-12-31'
      GROUP BY 1 ORDER BY 1

  - id: M-07
    type: medium
    test_user: sales.europe
    question: Revenue by country in my region last year
    expected_behaviour: correct_result
    expected_sql: |
      SELECT c.country, SUM(od.unit_price * od.quantity * (1 - od.discount)) AS revenue
      FROM orders o
      JOIN order_details od ON od.order_id = o.order_id
      JOIN customers c ON c.customer_id = o.customer_id
      WHERE o.order_date BETWEEN '2024-01-01' AND '2024-12-31'
      GROUP BY c.country

  - id: M-08
    type: medium
    test_user: operations
    question: Number of orders per shipper this year
    expected_behaviour: correct_result
    expected_sql: |
      SELECT s.company_name, count(*) AS orders
      FROM orders o JOIN shippers s ON s.shipper_id = o.ship_via
      WHERE o.order_date BETWEEN '2025-01-01' AND '2025-05-06'
      GROUP BY s.company_name

  - id: M-09
    type: medium
    test_user: finance
    question: What was the total discount given per category in 2024?
    expected_behaviour: correct_result
    expected_sql: |
      SELECT ca.category_name, SUM(od.unit_price * od.quantity * od.discount) AS discount_amount
      FROM orders o
      JOIN order_details od ON od.order_id = o.order_id
      JOIN products p ON p.product_id = od.product_id
      JOIN categories ca ON ca.category_id = p.category_id
      WHERE o.order_date BETWEEN '2024-01-01' AND '2024-12-31'
      GROUP BY ca.category_name

  - id: M-10
    type: medium
    test_user: operations
    question: How many units were sold in 2024 per supplier country?
    expected_behaviour: correct_result
    expected_sql: |
      SELECT s.country, SUM(od.quantity) AS units_sold
      FROM orders o
      JOIN order_details od ON od.order_id = o.order_id
      JOIN products p ON p.product_id = od.product_id
      JOIN suppliers s ON s.supplier_id = p.supplier_id
      WHERE o.order_date BETWEEN '2024-01-01' AND '2024-12-31'
      GROUP BY s.country

  - id: M-11
    type: medium
    test_user: finance
    question: Which employee brought in the most revenue in 2024?
    expected_behaviour: correct_result
    ordered: true
    expected_sql: |
      SELECT e.first_name, e.last_name,
             SUM(od.unit_price * od.quantity * (1 - od.discount)) AS revenue
      FROM orders o
      JOIN order_details od ON od.order_id = o.order_id
      JOIN employees e ON e.employee_id = o.employee_id
      WHERE o.order_date BETWEEN '2024-01-01' AND '2024-12-31'
      GROUP BY e.first_name, e.last_name ORDER BY revenue DESC LIMIT 1

  - id: M-12
    type: medium
    test_user: sales.americas
    question: Monthly number of orders in my region in 2024
    expected_behaviour: correct_result
    ordered: true
    expected_sql: |
      SELECT date_trunc('month', o.order_date)::date AS month, count(*) AS orders
      FROM orders o
      WHERE o.order_date BETWEEN '2024-01-01' AND '2024-12-31'
      GROUP BY 1 ORDER BY 1

  - id: M-13
    type: medium
    test_user: finance
    question: What was revenue per shipper in Q4 2024?
    expected_behaviour: correct_result
    expected_sql: |
      SELECT s.company_name, SUM(od.unit_price * od.quantity * (1 - od.discount)) AS revenue
      FROM orders o
      JOIN order_details od ON od.order_id = o.order_id
      JOIN shippers s ON s.shipper_id = o.ship_via
      WHERE o.order_date BETWEEN '2024-10-01' AND '2024-12-31'
      GROUP BY s.company_name

  - id: M-14
    type: medium
    test_user: operations
    question: What was the average number of days from order to shipment in each month of 2024?
    expected_behaviour: correct_result
    ordered: true
    expected_sql: |
      SELECT date_trunc('month', o.order_date)::date AS month,
             AVG(o.shipped_date - o.order_date) AS average_shipping_days
      FROM orders o
      WHERE o.order_date BETWEEN '2024-01-01' AND '2024-12-31' AND o.shipped_date IS NOT NULL
      GROUP BY 1 ORDER BY 1

  - id: M-15
    type: medium
    test_user: finance
    question: Which 5 ship countries had the highest freight cost last quarter?
    expected_behaviour: correct_result
    ordered: true
    expected_sql: |
      SELECT o.ship_country, SUM(o.freight) AS freight_cost
      FROM orders o
      WHERE o.order_date BETWEEN '2025-01-01' AND '2025-03-31'
      GROUP BY o.ship_country ORDER BY freight_cost DESC LIMIT 5

  # ===================================================================================
  # Hard: multi-join, comparisons, top-N per group (10)
  # ===================================================================================
  - id: H-01
    type: hard
    test_user: finance
    question: Show the 5 products whose revenue dropped the most between Q4 2024 and Q1 2025.
    notes: Reworded so it is not a copy of the verified example about quarterly revenue losses.
    expected_behaviour: correct_result
    ordered: true
    expected_sql: |
      WITH q AS (
        SELECT p.product_name,
               SUM(CASE WHEN o.order_date BETWEEN '2025-01-01' AND '2025-03-31'
                        THEN od.unit_price * od.quantity * (1 - od.discount) ELSE 0 END) AS last_quarter,
               SUM(CASE WHEN o.order_date BETWEEN '2024-10-01' AND '2024-12-31'
                        THEN od.unit_price * od.quantity * (1 - od.discount) ELSE 0 END) AS previous_quarter
        FROM orders o
        JOIN order_details od ON od.order_id = o.order_id
        JOIN products p ON p.product_id = od.product_id
        WHERE o.order_date BETWEEN '2024-10-01' AND '2025-03-31'
        GROUP BY p.product_name
      )
      SELECT q.product_name, q.last_quarter - q.previous_quarter AS revenue_change
      FROM q ORDER BY revenue_change ASC LIMIT 5

  - id: H-02
    type: hard
    test_user: finance
    question: What were the top 3 products by revenue in each category in 2024?
    expected_behaviour: correct_result
    expected_sql: |
      WITH r AS (
        SELECT ca.category_name, p.product_name,
               SUM(od.unit_price * od.quantity * (1 - od.discount)) AS revenue,
               ROW_NUMBER() OVER (PARTITION BY ca.category_name
                                  ORDER BY SUM(od.unit_price * od.quantity * (1 - od.discount)) DESC) AS rn
        FROM orders o
        JOIN order_details od ON od.order_id = o.order_id
        JOIN products p ON p.product_id = od.product_id
        JOIN categories ca ON ca.category_id = p.category_id
        WHERE o.order_date BETWEEN '2024-01-01' AND '2024-12-31'
        GROUP BY ca.category_name, p.product_name
      )
      SELECT r.category_name, r.product_name, r.revenue FROM r WHERE r.rn <= 3

  - id: H-03
    type: hard
    test_user: sales.europe
    question: For each country in my region, which customer had the highest revenue last year and what share of that country's revenue was it?
    expected_behaviour: correct_result
    expected_sql: |
      WITH r AS (
        SELECT c.country, c.company_name,
               SUM(od.unit_price * od.quantity * (1 - od.discount)) AS revenue
        FROM orders o
        JOIN order_details od ON od.order_id = o.order_id
        JOIN customers c ON c.customer_id = o.customer_id
        WHERE o.order_date BETWEEN '2024-01-01' AND '2024-12-31'
        GROUP BY c.country, c.company_name
      ), ranked AS (
        SELECT r.country, r.company_name, r.revenue,
               r.revenue / SUM(r.revenue) OVER (PARTITION BY r.country) AS share,
               ROW_NUMBER() OVER (PARTITION BY r.country ORDER BY r.revenue DESC) AS rn
        FROM r
      )
      SELECT ranked.country, ranked.company_name, ranked.share
      FROM ranked WHERE ranked.rn = 1

  - id: H-04
    type: hard
    test_user: finance
    question: Show revenue for each month of 2024 and the change from the previous month.
    expected_behaviour: correct_result
    ordered: true
    expected_sql: |
      WITH m AS (
        SELECT date_trunc('month', o.order_date)::date AS month,
               SUM(od.unit_price * od.quantity * (1 - od.discount)) AS revenue
        FROM orders o JOIN order_details od ON od.order_id = o.order_id
        WHERE o.order_date BETWEEN '2024-01-01' AND '2024-12-31'
        GROUP BY 1
      )
      SELECT m.month, m.revenue, m.revenue - LAG(m.revenue) OVER (ORDER BY m.month) AS change
      FROM m ORDER BY m.month

  - id: H-05
    type: hard
    test_user: finance
    question: Which customers placed orders in 2023 but none in 2024?
    expected_behaviour: correct_result
    expected_sql: |
      SELECT c.company_name FROM customers c
      WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id
                    AND o.order_date BETWEEN '2023-01-01' AND '2023-12-31')
        AND NOT EXISTS (SELECT 1 FROM orders o2 WHERE o2.customer_id = c.customer_id
                        AND o2.order_date BETWEEN '2024-01-01' AND '2024-12-31')

  - id: H-06
    type: hard
    test_user: operations
    question: For each shipper, what share of its 2024 orders was shipped late?
    expected_behaviour: correct_result
    expected_sql: |
      SELECT s.company_name,
             COUNT(*) FILTER (WHERE o.shipped_date > o.required_date)::numeric / COUNT(*) AS late_share
      FROM orders o JOIN shippers s ON s.shipper_id = o.ship_via
      WHERE o.order_date BETWEEN '2024-01-01' AND '2024-12-31'
      GROUP BY s.company_name

  - id: H-07
    type: hard
    test_user: finance
    question: Who were the top 2 employees by revenue in each of 2023 and 2024?
    expected_behaviour: correct_result
    expected_sql: |
      WITH r AS (
        SELECT EXTRACT(YEAR FROM o.order_date)::int AS year, e.first_name, e.last_name,
               SUM(od.unit_price * od.quantity * (1 - od.discount)) AS revenue
        FROM orders o
        JOIN order_details od ON od.order_id = o.order_id
        JOIN employees e ON e.employee_id = o.employee_id
        WHERE o.order_date BETWEEN '2023-01-01' AND '2024-12-31'
        GROUP BY 1, e.first_name, e.last_name
      ), ranked AS (
        SELECT r.*, ROW_NUMBER() OVER (PARTITION BY r.year ORDER BY r.revenue DESC) AS rn FROM r
      )
      SELECT ranked.year, ranked.first_name, ranked.last_name, ranked.revenue
      FROM ranked WHERE ranked.rn <= 2

  - id: H-08
    type: hard
    test_user: sales.europe
    question: Which products sold in my region in 2024 had revenue above the average product revenue?
    expected_behaviour: correct_result
    expected_sql: |
      WITH r AS (
        SELECT p.product_name, SUM(od.unit_price * od.quantity * (1 - od.discount)) AS revenue
        FROM orders o
        JOIN order_details od ON od.order_id = o.order_id
        JOIN products p ON p.product_id = od.product_id
        WHERE o.order_date BETWEEN '2024-01-01' AND '2024-12-31'
        GROUP BY p.product_name
      )
      SELECT r.product_name, r.revenue FROM r WHERE r.revenue > (SELECT AVG(r2.revenue) FROM r r2)

  - id: H-09
    type: hard
    test_user: finance
    question: Compare revenue by category in Q1 2025 with Q1 2024 and show the difference.
    expected_behaviour: correct_result
    expected_sql: |
      SELECT ca.category_name,
             SUM(CASE WHEN o.order_date BETWEEN '2025-01-01' AND '2025-03-31'
                      THEN od.unit_price * od.quantity * (1 - od.discount) ELSE 0 END) AS q1_2025,
             SUM(CASE WHEN o.order_date BETWEEN '2024-01-01' AND '2024-03-31'
                      THEN od.unit_price * od.quantity * (1 - od.discount) ELSE 0 END) AS q1_2024,
             SUM(CASE WHEN o.order_date BETWEEN '2025-01-01' AND '2025-03-31'
                      THEN od.unit_price * od.quantity * (1 - od.discount) ELSE 0 END)
             - SUM(CASE WHEN o.order_date BETWEEN '2024-01-01' AND '2024-03-31'
                        THEN od.unit_price * od.quantity * (1 - od.discount) ELSE 0 END) AS difference
      FROM orders o
      JOIN order_details od ON od.order_id = o.order_id
      JOIN products p ON p.product_id = od.product_id
      JOIN categories ca ON ca.category_id = p.category_id
      WHERE o.order_date BETWEEN '2024-01-01' AND '2024-03-31'
         OR o.order_date BETWEEN '2025-01-01' AND '2025-03-31'
      GROUP BY ca.category_name

  - id: H-10
    type: hard
    test_user: finance
    question: What was the cumulative revenue month by month through 2024?
    expected_behaviour: correct_result
    ordered: true
    expected_sql: |
      WITH m AS (
        SELECT date_trunc('month', o.order_date)::date AS month,
               SUM(od.unit_price * od.quantity * (1 - od.discount)) AS revenue
        FROM orders o JOIN order_details od ON od.order_id = o.order_id
        WHERE o.order_date BETWEEN '2024-01-01' AND '2024-12-31'
        GROUP BY 1
      )
      SELECT m.month, SUM(m.revenue) OVER (ORDER BY m.month) AS cumulative_revenue
      FROM m ORDER BY m.month

